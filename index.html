<title>Music Jelly</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Lexend:wght@400;600&display=swap">
<style>
:root{
  --sky:#d4eeff; --ink:#24133b; --card:#ffffff; --berry:#ff4d6d;
  --display:"Titan One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --panel-h:clamp(120px,26vh,240px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--display);overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
/* the message panel: one message at a time, above the keys */
#panel{flex:0 0 var(--panel-h);margin:clamp(10px,2vh,22px) clamp(12px,4vw,60px) 0;padding:clamp(10px,2vh,22px) clamp(16px,3vw,44px);
  background:var(--card);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,28px);cursor:default;overflow:hidden;user-select:none;-webkit-user-select:none}
#panelText{font-size:clamp(1.2rem,.9rem + 2.2vh + .9vw,2.8rem);line-height:1.1;text-align:center;text-wrap:balance}
/* the game's letters: the one to find now is big and ringed, found ones are ticked off in green, later ones wait */
#panelOrder{display:flex;justify-content:center;gap:clamp(8px,1.4vw,20px);margin-top:clamp(4px,1vh,10px)}
#panelOrder[hidden]{display:none}
#panelOrder span{--c:var(--ink);width:1.5em;height:1.5em;border-radius:.4em;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.2rem,.9rem + 2.2vh + .9vw,2.8rem);line-height:1;color:var(--c);border:4px solid transparent;transition:transform .2s,opacity .2s}
#panelOrder span[data-is="now"]{border-color:var(--ink);background:#fff7d6;transform:scale(1.15)}
#panelOrder span[data-is="later"]{opacity:.85}
#panelOrder span[data-is="found"]{background:#2fd35a;color:#fff}
/* the mark that says "tap, or press space, to go on": shown only on panels that wait for a tap */
#panelGo{flex:0 0 auto;width:clamp(40px,7vh,64px);height:clamp(40px,7vh,64px);border-radius:50%;background:var(--berry);border:4px solid var(--ink);
  display:none;align-items:center;justify-content:center;animation:go 1.1s ease-in-out infinite}
#panelGo::before{content:"";border-style:solid;border-width:.7em 0 .7em 1.1em;border-color:transparent transparent transparent #fff;margin-left:.25em;font-size:clamp(11px,1.9vh,17px)}
#panel[data-next="tap"]{cursor:pointer}
#panel[data-next="tap"] #panelGo{display:flex}
@keyframes go{50%{transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){#panelGo{animation:none}}
#stage{flex:1 1 0;min-height:0;width:100%;display:block;touch-action:none}
/* shown over everything while no MIDI keyboard is connected */
#notice{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:6vw;background:var(--sky);
  font-size:clamp(1.4rem,1rem + 2.4vw,3rem);line-height:1.2;text-align:center;text-wrap:balance}
body[data-keyboard="no"] #notice{display:flex}
/* the piano samples' licence asks for this line */
#credit{position:fixed;right:10px;bottom:6px;font:400 11px/1.2 "Lexend",system-ui,sans-serif;color:#24133b99;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}
</script>
</head>
<body>
<div id="panel" role="button" tabindex="0" aria-live="polite"><div id="panelBody"><div id="panelText"></div><div id="panelOrder" hidden></div></div><div id="panelGo" aria-hidden="true"></div></div>
<canvas id="stage"></canvas>
<div id="notice" role="alert">Music Jelly requires a MIDI keyboard. Please connect one to this computer.</div>
<div id="credit">Piano sound: Salamander Grand Piano by Alexander Holm, CC BY 3.0</div>
<script type="module" src="src/main.mjs"></script>
</body>
</html>
